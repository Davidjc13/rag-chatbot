apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
  namespace: rag-chatbot
  labels:
    app.kubernetes.io/name: rag-chatbot
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-chatbot
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-chatbot
        app.kubernetes.io/component: api
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Esperando Postgres…"; sleep 2;
              done
        - name: wait-neo4j
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z neo4j 7687; do
                echo "Esperando Neo4j…"; sleep 2;
              done
      containers:
        - name: chatbot
          image: rag-chatbot:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: chatbot-config
          env:
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
            - name: LLM_PROVIDER
              value: ollama
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: chatbot-config
                  key: OLLAMA_MODEL
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot
  namespace: rag-chatbot
  labels:
    app.kubernetes.io/name: rag-chatbot
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rag-chatbot
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
