apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbot-config
  namespace: rag-chatbot
  labels:
    app.kubernetes.io/name: rag-chatbot
    app.kubernetes.io/component: api
data:
  APP_NAME: "RAG Chatbot"
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  LOG_JSON: "true"
  HOST: "0.0.0.0"
  PORT: "8000"
  LLM_PROVIDER: "litellm"
  LITELLM_MODEL: "ollama/qwen2.5:3b"
  LITELLM_API_BASE: "http://ollama:11434"
  LITELLM_TIMEOUT_SECONDS: "120"
  LITELLM_TEMPERATURE: "0.7"
  LITELLM_EMBEDDING_MODEL: "ollama/nomic-embed-text"
  CHUNK_SIZE: "800"
  CHUNK_OVERLAP: "100"
  RAG_TOP_K: "4"
  RAG_MIN_SCORE: "0.25"
  OLLAMA_MODEL: "qwen2.5:3b"
  OLLAMA_EMBED_MODEL: "nomic-embed-text"
  DATABASE_URL: "postgresql+asyncpg://chatbot:chatbot@postgres:5432/chatbot"
  EMBEDDING_DIMENSION: "768"
