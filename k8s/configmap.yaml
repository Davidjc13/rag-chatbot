apiVersion: v1
kind: ConfigMap
metadata:
  name: chatbot-config
  namespace: rag-chatbot
  labels:
    app.kubernetes.io/name: rag-chatbot
    app.kubernetes.io/component: api
data:
  APP_NAME: "RAG Chatbot"
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  LOG_JSON: "true"
  HOST: "0.0.0.0"
  PORT: "8000"
  LLM_PROVIDER: "ollama"
  LITELLM_MODEL: "ollama/qwen2.5:3b"
  LITELLM_API_BASE: "http://ollama:11434"
  LITELLM_TIMEOUT_SECONDS: "120"
  LITELLM_TEMPERATURE: "0.7"
  LITELLM_EMBEDDING_MODEL: "ollama/nomic-embed-text"
  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_MODEL: "qwen2.5:3b"
  OLLAMA_EMBED_MODEL: "nomic-embed-text"
  OLLAMA_THINK: "false"
  OLLAMA_NUM_PREDICT: "4096"
  CHUNK_SIZE: "800"
  CHUNK_OVERLAP: "100"
  RAG_TOP_K: "4"
  RAG_MIN_SCORE: "0.25"
  AGENT_MAX_STEPS: "4"
  AUTH_ENABLED: "true"
  CORS_ORIGINS: "*"
  RATE_LIMIT_CHAT: "60"
  RATE_LIMIT_UPLOAD: "20"
  RATE_LIMIT_EVAL: "10"
  RAG_HYBRID: "true"
  RAG_CANDIDATES: "20"
  RAG_HYBRID_ALPHA: "0.7"
  CHAT_MAX_HISTORY_MESSAGES: "16"
  EVAL_WORKER_ENABLED: "true"
  EMBEDDING_DIMENSION: "768"
  VECTOR_BACKEND: "postgres"
  NEO4J_ENABLED: "true"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USERNAME: "neo4j"
  NEO4J_DATABASE: "neo4j"
  NEO4J_VECTOR_INDEX: "chunk_embeddings"
  NEO4J_EMBEDDING_DIMENSION: "768"
