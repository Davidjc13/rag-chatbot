apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-model
  namespace: rag-chatbot
  labels:
    app.kubernetes.io/name: rag-chatbot
    app.kubernetes.io/component: ollama-init
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-chatbot
        app.kubernetes.io/component: ollama-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: curlimages/curl:8.11.1
          env:
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: chatbot-config
                  key: OLLAMA_MODEL
            - name: OLLAMA_EMBED_MODEL
              valueFrom:
                configMapKeyRef:
                  name: chatbot-config
                  key: OLLAMA_EMBED_MODEL
          command:
            - /bin/sh
            - -c
            - |
              echo "Esperando a Ollama en $OLLAMA_BASE_URL ..."
              until curl -sf "$OLLAMA_BASE_URL/"; do sleep 3; done
              echo "Descargando modelo $OLLAMA_MODEL ..."
              curl -sf "$OLLAMA_BASE_URL/api/pull" \
                -H "Content-Type: application/json" \
                -d "{\"name\": \"$OLLAMA_MODEL\"}"
              echo "Descargando embeddings $OLLAMA_EMBED_MODEL ..."
              curl -sf "$OLLAMA_BASE_URL/api/pull" \
                -H "Content-Type: application/json" \
                -d "{\"name\": \"$OLLAMA_EMBED_MODEL\"}"
              echo "Modelos listos."
