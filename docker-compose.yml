services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-chatbot
    ports:
      - "${PORT:-8000}:8000"
    environment:
      APP_NAME: "RAG Chatbot"
      APP_ENV: development
      LOG_LEVEL: INFO
      LOG_JSON: "false"
      LLM_PROVIDER: litellm
      LITELLM_MODEL: ${LITELLM_MODEL:-ollama/qwen2.5:3b}
      LITELLM_API_BASE: http://ollama:11434
      LITELLM_TIMEOUT_SECONDS: "120"
      LITELLM_TEMPERATURE: "0.7"
      LITELLM_EMBEDDING_MODEL: ${LITELLM_EMBEDDING_MODEL:-ollama/nomic-embed-text}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      CHUNK_SIZE: "800"
      CHUNK_OVERLAP: "100"
      RAG_TOP_K: "4"
      RAG_MIN_SCORE: "0.25"
      SYSTEM_PROMPT: "Eres un asistente de documentos. Responde solo con información del contexto RAG."
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - chatbot-net
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - chatbot-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Descarga el modelo al arrancar (one-shot)
  ollama-init:
    image: ollama/ollama:latest
    container_name: rag-ollama-init
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Esperando a Ollama..."
        sleep 5
        MODEL="$${OLLAMA_MODEL:-qwen2.5:3b}"
        EMBED="$${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
        ollama pull "$$MODEL"
        ollama pull "$$EMBED"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    networks:
      - chatbot-net
    restart: "no"

networks:
  chatbot-net:
    driver: bridge

volumes:
  ollama_data:
