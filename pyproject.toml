[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Chatbot hexagonal con LiteLLM, FastAPI, Docker y Kubernetes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "litellm>=1.55.0,<1.75",
    "openpyxl>=3.1.0",
    "pdfplumber>=0.11.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-docx>=1.1.0",
    "python-json-logger>=2.0.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pylint>=3.3.0",
    "ruff>=0.7.0",
]

[project.scripts]
chatbot = "chatbot.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]

[tool.hatch.build.targets.wheel.force-include]
"src/chatbot/infrastructure/adapters/api/static" = "chatbot/infrastructure/adapters/api/static"

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pylint.main]
jobs = 0
py-version = "3.11"
source-roots = ["src"]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "duplicate-code",
]

[tool.pylint.format]
max-line-length = 100

[tool.coverage.run]
source = ["chatbot"]
branch = true
